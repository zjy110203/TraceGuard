<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TeamFlow 登录</title>
</head>
<body>
  <h1>TeamFlow</h1>
  <p>受控被测应用 · 项目协作最小闭环</p>
  {% if error %}<p style="color:#b00020" data-testid="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>用户名 <input name="username" data-testid="username" autocomplete="username"></label><br>
    <label>密码 <input type="password" name="password" data-testid="password" autocomplete="current-password"></label><br>
    <button type="submit" data-testid="{{ 'login-submit-v2' if request.app.state.ui_revision|default('v1') == 'v2' else 'login-submit' }}">登录</button>
  </form>
</body>
</html>
