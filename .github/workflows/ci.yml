name: CI

on:
  push:
    # R5-5.1: the development branch must be able to trigger CI on its own
    # push. Without it a push to the branch under review produced no run at
    # all, so "CI is green" could only ever be claimed for main/develop.
    branches: [main, develop, r5-5-product-completion]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo. No secrets are required by any job.
permissions:
  contents: read

jobs:
  python:
    name: Python quality + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build the workbench SPA
        # R5-4.8: the workbench UI tests used to SKIP because the dist was not
        # built. Building here makes them part of the real gate instead of a
        # permanent skip.
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Install Playwright browser (bundled Chromium for CI)
        run: python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        # Scope matches README: packages, apps AND benchmark. Excluding
        # benchmark would lower the bar, so it stays in.
        run: mypy packages apps benchmark --ignore-missing-imports
      - name: Unit + integration tests
        # pipefail preserves pytest's real exit code through tee.
        # TRACEGUARD_BROWSER_CHANNEL="" runs the browser tests against the
        # bundled Chromium (the runner has no system Chrome).
        env:
          TRACEGUARD_BROWSER_CHANNEL: ""
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

  security:
    name: Security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Chromium (repair sandbox drives a real browser)
        run: python -m playwright install --with-deps chromium
      - name: Security gate (9 files, same runner as local)
        # R5-4.11: the gate previously existed only locally. It runs the exact
        # same 9 files the reports cite, so the documented scope and the executed
        # scope cannot drift apart again.
        env:
          TRACEGUARD_BROWSER_CHANNEL: ""
        run: python scripts/verify_all.py --mode security
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: .traceguard-tmp/r5/verify
          if-no-files-found: warn

  web:
    name: Web type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies (lockfile only)
        run: npm ci
      - name: Dependency consistency
        run: npm ls --depth=0
      - name: Vue / TypeScript type check
        run: npx --no-install vue-tsc --noEmit
      - name: Vite production build
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  product-e2e:
    name: Product E2E (real flow, isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build the workbench SPA
        # The product flow verifies the built frontend is actually served, so the
        # build is part of the gate rather than an assumption.
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Install Chromium (CI-only, never touches a personal Chrome)
        run: |
          python -m playwright install --with-deps chromium
      - name: Product flow (isolated SUT + isolated API + real browser)
        env:
          # No system Chrome on the runner: use Playwright's bundled Chromium.
          TRACEGUARD_BROWSER_CHANNEL: ""
        run: python scripts/verify_all.py --mode product
      - name: Upload product E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e
          path: .traceguard-tmp/r5/verify
          if-no-files-found: warn

  browser-e2e:
    name: Browser E2E (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build the workbench SPA
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Install Chromium (CI-only, never touches a personal Chrome)
        run: |
          python -m playwright install --with-deps chromium
      - name: Browser acceptance (5 viewports)
        env:
          # The runner has no system Chrome: use Playwright's bundled Chromium.
          TRACEGUARD_BROWSER_CHANNEL: ""
        run: python scripts/verify_all.py --mode browser
      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: .traceguard-tmp/r5/verify
          if-no-files-found: warn
