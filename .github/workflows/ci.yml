name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy packages apps --ignore-missing-imports
      - name: Diagnose collection (temporary)
        run: |
          echo "=== python/deps ==="
          python --version
          python -m pip show pytest pytest-cov | grep -E 'Name|Version' || true
          echo "=== collect-only (exposes import/collection errors) ==="
          pytest --collect-only -q 2>&1 | tail -40
          echo "=== files needed by tests ==="
          ls -la benchmark/cases/ | head -5
      - name: Unit + integration tests
        run: pytest -q --cov=packages --cov=apps --cov-report=term-missing
