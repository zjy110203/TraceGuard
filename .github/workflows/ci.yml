name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy packages apps --ignore-missing-imports
      - name: Unit + integration tests
        # pipefail preserves pytest's real exit code through tee.
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Surface pytest error as annotation
        if: failure()
        run: |
          echo "::group::pytest tail"
          tail -40 pytest-output.txt
          echo "::endgroup::"
          # Emit the last error lines as a check annotation (readable via public API)
          ERR=$(grep -E "ERROR|error|FAILED|E   |ImportError|ModuleNotFound|exit code" pytest-output.txt | tail -8 | tr '\n' ' ')
          echo "::error::PYTEST_DIAG: ${ERR:0:600}"
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
