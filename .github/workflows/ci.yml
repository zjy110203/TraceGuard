name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy packages apps --ignore-missing-imports
      - name: Unit + integration tests
        # Coverage reporting is validated locally; CI runs the suite without
        # --cov because pytest-cov 7.x on ubuntu/python3.13 exits with code 2
        # in this project's isolated-subprocess test environment.
        run: pytest -q
