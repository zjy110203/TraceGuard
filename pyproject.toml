[project]
name = "traceguard"
version = "0.1.0-m0"
description = "TraceGuard — Agentic Web UI Testing & Quality Intelligence Platform (M0 skeleton, v1.1 baseline)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end tests against TestClient apps",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Autogenerated DDL: reflowing it risks changing string literals, so it is
# excluded from lint/format while env.py and the rest stay checked.
# docs/research holds verbatim third-party research reports (with embedded
# Python snippets) copied as source material — never reformat archived evidence.
extend-exclude = ["alembic/versions", "docs/research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() in argument defaults is the intended pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
